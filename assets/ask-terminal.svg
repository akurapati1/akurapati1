system for enterprise medical</text><text x="48" y="172" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="normal" fill="#e6edf3" textLength="554.4" lengthAdjust="spacing" clip-path="url(#clip3)" xml:space="preserve">report generation: 2-3 weeks of turnaround down to under a minute.</text></g><g opacity="0" ><animate attributeName="opacity" dur="27s" repeatCount="indefinite" keyTimes="0;0.33;0.34;0.66;0.66;1" values="0;0;1;1;0;0"/><text x="48" y="84" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="700" fill="#58a6ff" textLength="369" lengthAdjust="spacing" clip-path="url(#clip4)" xml:space="preserve">$ Have you built multi-agent LLM systems?</text><g opacity="0" ><animate attributeName="opacity" dur="27s" repeatCount="indefinite" keyTimes="0;0.42;0.42;0.44;0.44;1" values="0;0;1;1;0;0"/><circle cx="52" cy="112" r="3.5" fill="#a371f7"><animate attributeName="opacity" values="1;.2;1" dur="0.6s" repeatCount="indefinite"/></circle><text x="64" y="116" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="normal" fill="#8b949e" text-anchor="start" >retrieving context · reasoning · citing sources</text></g><text x="48" y="148" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="normal" fill="#e6edf3" textLength="579.6" lengthAdjust="spacing" clip-path="url(#clip5)" xml:space="preserve">Yes. Agentic Market Researcher runs Claude Haiku + Sonnet agents with</text><text x="48" y="172" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="normal" fill="#e6edf3" textLength="445.2" lengthAdjust="spacing" clip-path="url(#clip6)" xml:space="preserve">prompt caching and weighted ranking over 20+ sources.</text></g><g opacity="0" ><animate attributeName="opacity" dur="27s" repeatCount="indefinite" keyTimes="0;0.67;0.67;0.99;1;1" values="0;0;1;1;0;0"/><text x="48" y="84" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="700" fill="#58a6ff" textLength="360" lengthAdjust="spacing" clip-path="url(#clip7)" xml:space="preserve">$ How do you keep AI output trustworthy?</text><g opacity="0" ><animate attributeName="opacity" dur="27s" repeatCount="indefinite" keyTimes="0;0.75;0.75;0.77;0.77;1" values="0;0;1;1;0;0"/><circle cx="52" cy="112" r="3.5" fill="#a371f7"><animate attributeName="opacity" values="1;.2;1" dur="0.6s" repeatCount="indefinite"/></circle><text x="64" y="116" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="normal" fill="#8b949e" text-anchor="start" >retrieving context · reasoning · citing sources</text></g><text x="48" y="148" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="normal" fill="#e6edf3" textLength="504" lengthAdjust="spacing" clip-path="url(#clip8)" xml:space="preserve">Human-in-the-loop review, RLHF-inspired feedback loops, plus</text><text x="48" y="172" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="normal" fill="#e6edf3" textLength="420" lengthAdjust="spacing" clip-path="url(#clip9)" xml:space="preserve">validation and monitoring built into the pipeline.</text></g><text x="48" y="220" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" font-weight="normal" fill="#3fb950" text-anchor="start" >answers are generated from my real project data - try it live below</text></svg>
