<svg xmlns="http://www.w3.org/2000/svg" width="960" height="340" viewBox="0 0 960 340" role="img" aria-label="Impact metrics"><title>Impact metrics</title><desc>Animated counters for project outcomes and live GitHub activity</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#111a2b"/></linearGradient></defs><style>.ac{transform-box:fill-box;transform-origin:center;animation:ac 4s ease-in-out infinite}@keyframes ac{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.55)}}</style><rect width="960" height="340" rx="14" fill="url(#bg)"/><rect x="0.5" y="0.5" width="959" height="339" rx="14" fill="none" stroke="#30363d"/><text x="32" y="40" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="700" fill="#8b949e" text-anchor="start" letter-spacing="2">IMPACT</text><text x="32" y="62" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="normal" fill="#8b949e" text-anchor="start" >What the systems I build actually moved</text><rect x="24" y="78" width="216" height="104" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1" /><rect class="ac" x="24" y="92" width="3" height="76" rx="1.5" fill="#3fb950"/><text x="44" y="130" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="34" font-weight="700" fill="#3fb950" text-anchor="start" >&lt;1 min</text><text x="226" y="95" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="10" font-weight="normal" fill="#8b949e" text-anchor="end" text-decoration="line-through">was 2-3 weeks</text><text x="44" y="152" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#e6edf3" text-anchor="start" >report turnaround</text><text x="44" y="170" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="10" font-weight="normal" fill="#8b949e" text-anchor="start" >J&amp;J - GCP agentic system</text><rect x="256" y="78" width="216" height="104" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1" /><rect class="ac" x="256" y="92" width="3" height="76" rx="1.5" fill="#a371f7"/><text x="276" y="130" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="34" font-weight="700" fill="#a371f7" text-anchor="start" >20+</text><text x="276" y="152" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#e6edf3" text-anchor="start" >sources synthesized</text><text x="276" y="170" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="10" font-weight="normal" fill="#8b949e" text-anchor="start" >Agentic Market Researcher</text><rect x="488" y="78" width="216" height="104" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1" /><rect class="ac" x="488" y="92" width="3" height="76" rx="1.5" fill="#58a6ff"/><text x="508" y="130" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="34" font-weight="700" fill="#58a6ff" text-anchor="start" >3+ hrs</text><text x="508" y="152" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#e6edf3" text-anchor="start" >of research -&gt; 1 click</text><text x="508" y="170" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="10" font-weight="normal" fill="#8b949e" text-anchor="start" >Agentic Market Researcher</text><rect x="720" y="78" width="216" height="104" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1" /><rect class="ac" x="720" y="92" width="3" height="76" rx="1.5" fill="#f0883e"/><text x="740" y="130" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="34" font-weight="700" fill="#f0883e" text-anchor="start" >10+</text><text x="740" y="152" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#e6edf3" text-anchor="start" >tables, asked in English</text><text x="740" y="170" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="10" font-weight="normal" fill="#8b949e" text-anchor="start" >AI SQL Data Retrieval Agent</text><rect x="24" y="198" width="216" height="104" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1" /><rect class="ac" x="24" y="212" width="3" height="76" rx="1.5" fill="#39d353"/><text x="44" y="250" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="34" font-weight="700" fill="#39d353" text-anchor="start" >261</text><text x="44" y="272" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#e6edf3" text-anchor="start" >contributions</text><text x="44" y="290" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="10" font-weight="normal" fill="#8b949e" text-anchor="start" >last 12 months</text><rect x="256" y="198" width="216" height="104" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1" /><rect class="ac" x="256" y="212" width="3" height="76" rx="1.5" fill="#58a6ff"/><text x="276" y="250" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="34" font-weight="700" fill="#58a6ff" text-anchor="start" >77</text><text x="276" y="272" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#e6edf3" text-anchor="start" >active days</text><text x="276" y="290" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="10" font-weight="normal" fill="#8b949e" text-anchor="start" >days with commits/PRs</text><rect x="488" y="198" width="216" height="104" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1" /><rect class="ac" x="488" y="212" width="3" height="76" rx="1.5" fill="#a371f7"/><text x="508" y="250" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="34" font-weight="700" fill="#a371f7" text-anchor="start" >8 days</text><text x="508" y="272" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#e6edf3" text-anchor="start" >longest streak</text><text x="508" y="290" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="10" font-weight="normal" fill="#8b949e" text-anchor="start" >consecutive days</text><rect x="720" y="198" width="216" height="104" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1" /><rect class="ac" x="720" y="212" width="3" height="76" rx="1.5" fill="#f0883e"/><text x="740" y="250" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="34" font-weight="700" fill="#f0883e" text-anchor="start" >71</text><text x="740" y="272" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#e6edf3" text-anchor="start" >public repos</text><text x="740" y="290" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="10" font-weight="normal" fill="#8b949e" text-anchor="start" >own, non-fork</text><text x="928" y="326" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="10" font-weight="normal" fill="#8b949e" text-anchor="end" >live numbers refresh daily via GitHub Actions</text></svg>
